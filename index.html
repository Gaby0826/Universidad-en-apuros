<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="manus-game-loading-screen" content="1">
  <meta name="theme-color" content="#1b2233">
  <title>Universidad en Apuros</title>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

  <style>
    :root {
      color-scheme: dark;
      --ink: #101728;
      --night: #1b2233;
      --panel: #2b3450;
      --cream: #f7ecd6;
      --amber: #f0a13c;
      --coral: #e2654a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--night);
      color: var(--cream);
      font-family: "Courier New", ui-monospace, monospace;
    }
    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      touch-action: none;
      background: var(--night);
    }
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 16px;
      padding: 32px 24px;
      text-align: center;
      background: radial-gradient(circle at 50% 18%, #2b3450 0%, #1b2233 62%, #101728 100%);
      z-index: 2;
    }
    #loading::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(0deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }
    #loading > * { position: relative; max-width: min(640px, 100%); }
    #loading .subtitle {
      margin: 0;
      font-size: clamp(10px, 1.4vw, 13px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--amber);
    }
    #loading h1 {
      margin: 0;
      font-size: clamp(22px, 4.2vw, 40px);
      line-height: 1.2;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--cream);
      text-shadow: 4px 4px 0 var(--ink);
    }
    #loading-status {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0.08em;
      color: #cdbfa4;
    }
    #loading progress {
      display: block;
      width: min(360px, 78vw);
      height: 14px;
      border: 3px solid var(--ink);
      background: #151b2b;
      appearance: none;
      -webkit-appearance: none;
    }
    #loading progress::-webkit-progress-bar { background: #151b2b; }
    #loading progress::-webkit-progress-value { background: var(--amber); }
    #loading progress::-moz-progress-bar { background: var(--amber); }
    #loading-notice {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      color: #cdbfa4;
    }
    #loading button {
      min-height: 44px;
      padding: 10px 22px;
      border: 3px solid var(--ink);
      border-radius: 2px;
      background: var(--panel);
      color: var(--cream);
      font: inherit;
      font-size: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    #loading button:hover { border-color: var(--amber); }
    #loading button:focus-visible { outline: 3px solid var(--amber); outline-offset: 4px; }
    #loading [hidden] { display: none !important; }
    #loading[hidden], #loading [hidden] { display: none !important; }
    noscript { display: block; margin-top: 8px; color: var(--coral); }
    @media (max-width: 520px) {
      #loading { gap: 12px; }
      #loading h1 { letter-spacing: 0.05em; }
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0">Tu navegador no es compatible con canvas.</canvas>
  <section id="loading" role="status">
    <p class="subtitle">Aventura de exploración</p>
    <h1 id="game-title"></h1>
    <p id="loading-status">Cargando…</p>
    <progress id="loading-progress" aria-label="Progreso de descarga"></progress>
    <p id="loading-notice" hidden></p>
    <button id="loading-retry" type="button" hidden>Reintentar</button>
    <noscript>Este juego necesita JavaScript para funcionar.</noscript>
  </section>
  <script>
    (() => {
      const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":21295340,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
      const threads = false;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      document.getElementById('game-title').textContent = document.title;
      retry.addEventListener('click', () => window.location.reload());

      let failed = false;
      let ready = false;
      const startedAt = performance.now();
      let lastProgressAt = startedAt;
      let downloadedBytes = 0;
      let downloadComplete = false;

      const updateNotice = () => {
        if (failed || ready || performance.now() - startedAt < 30000) return;
        notice.hidden = false;
        retry.hidden = false;
        const message = performance.now() - lastProgressAt >= 30000
          ? 'No hay progreso de carga reciente. Puedes seguir esperando o reintentar.'
          : 'El juego sigue cargando. Puedes seguir esperando o reintentar.';
        if (notice.textContent !== message) notice.textContent = message;
      };

      const onWindowError = (event) => fail(event.error || new Error('Engine startup error'));
      const onUnhandledRejection = (event) => fail(event.reason || new Error('Engine startup rejected'));
      const startupWatch = setInterval(updateNotice, 1000);
      const stopObserving = () => {
        clearInterval(startupWatch);
        window.removeEventListener('error', onWindowError);
        window.removeEventListener('unhandledrejection', onUnhandledRejection);
      };
      const fail = (error) => {
        if (failed || ready) return;
        failed = true;
        stopObserving();
        console.error('[game-loading] Startup failed', error);
        loading.hidden = false;
        status.textContent = 'No se pudo cargar el juego. Inténtalo de nuevo.';
        progress.hidden = true;
        notice.hidden = true;
        retry.hidden = false;
      };

      window.addEventListener('error', onWindowError);
      window.addEventListener('unhandledrejection', onUnhandledRejection);

      const onProgress = (current, total) => {
        if (failed || ready) return;
        if (Number.isFinite(current) && current > downloadedBytes) {
          downloadedBytes = current;
          lastProgressAt = performance.now();
        }
        if (!downloadComplete && Number.isFinite(total) && total > 0 && Number.isFinite(current) && current >= total) {
          downloadComplete = true;
          lastProgressAt = performance.now();
        }
        updateNotice();
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.removeAttribute('value');
          status.textContent = 'Cargando…';
          return;
        }
        progress.max = total;
        progress.value = Math.min(current, total);
        status.textContent = current >= total
          ? 'Iniciando el juego…'
          : `Cargando… ${Math.floor(current / total * 100)}%`;
      };

      const start = async () => {
        if (failed) return;
        try {
          lastProgressAt = performance.now();
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true;
          stopObserving();
          notice.hidden = true;
          retry.hidden = true;
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (failed) return;
            loading.hidden = true;
            if (config['focusCanvas']) canvas.focus();
          }));
        } catch (error) {
          fail(error);
        }
      };

      const script = document.createElement('script');
      script.src = 'index.js';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once: true });
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
